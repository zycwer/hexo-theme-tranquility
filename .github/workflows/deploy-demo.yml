# 演示站自动部署：push 到 main 即重新构建并发布到 GitHub Pages
# 演示内容 = demo/ 目录（Hexo 站点源文件），主题代码 = 本次提交检出的仓库本身
# 因此每次 commit 后，演示站展示的都是主题的最新状态
# 首次使用需在仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy demo site

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，旧任务自动取消
concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: demo/package.json

      - name: Copy theme into demo site
        run: |
          # 把当前检出的主题代码复制为 demo 站点的主题：
          # 演示站永远构建"本次提交"的主题，而不是 npm 上的发布版本
          mkdir -p demo/themes/tranquility
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'demo' \
            --exclude '.github' \
            --exclude 'doc' \
            ./ demo/themes/tranquility/

      - name: Install dependencies
        working-directory: demo
        run: npm ci --no-audit --no-fund

      - name: Build site
        working-directory: demo
        run: |
          set -o pipefail
          npx hexo generate 2>&1 | tee build.log
          if grep -qE '^ERROR' build.log; then
            echo "::error::hexo generate reported errors (see build.log above)"
            exit 1
          fi

      - name: Assert build artifacts
        working-directory: demo
        run: |
          test -f public/index.html
          test -f public/css/layout.css
          test -f public/font/normal.woff
          test -f public/sw.js
          test -f public/manifest.json
          test -f public/offline.html
          test -f public/search.json
          test -f public/atom.xml
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/about/index.html
          grep -q 'Content-Security-Policy' public/index.html
          grep -q '?v=' public/index.html
          echo "All demo artifacts verified."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
